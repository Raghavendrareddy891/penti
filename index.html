<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f5">
  <title>A little question for you</title>
  <style>
    :root { color-scheme: light; --ink:#29221f; --muted:#796c67; --pink:#e65c76; --paper:#fffdfb; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif; background:radial-gradient(ellipse at 15% 10%,#ffe6e1 0,transparent 35%),radial-gradient(ellipse at 90% 85%,#fce4ec 0,transparent 33%),#fff8f5; }
    .card { width:min(100%, 560px); min-height:400px; padding:clamp(30px,7vw,64px); display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; background:rgba(255,253,251,.88); border:1px solid rgba(116,75,63,.1); border-radius:30px; box-shadow:0 24px 70px rgba(111,63,50,.11); animation:arrive .45s ease both; }
    .mark { display:grid; place-items:center; width:54px;height:54px;margin-bottom:24px;border-radius:18px;background:#ffedea;color:var(--pink);font-size:27px; }
    .eyebrow { margin:0 0 12px; color:var(--pink); font-size:12px; font-weight:750; letter-spacing:.16em; text-transform:uppercase; }
    h1 { max-width:440px; margin:0; font-size:clamp(34px,7vw,52px); line-height:1.08; letter-spacing:-.045em; }
    .copy { margin:16px 0 30px; color:var(--muted); font-size:16px; line-height:1.6; }
    .actions { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
    button { min-width:132px; padding:14px 24px; border:0; border-radius:999px; font:inherit; font-weight:700; cursor:pointer; transition:transform .18s, box-shadow .18s, background .18s; }
    button:hover { transform:translateY(-2px); }
    button:focus-visible { outline:3px solid #ef9bad; outline-offset:3px; }
    .primary { background:var(--pink); color:white; box-shadow:0 8px 20px #e65c7638; }
    .primary:hover { background:#d84d69; box-shadow:0 11px 24px #e65c7645; }
    .secondary { background:#f5efec; color:#554943; }
    .secondary:hover { background:#eee5e0; }
    .answer { display:none; width:100%; }
    .answer.active { display:flex; }
    .answer img { display:block; width:min(100%,300px); max-height:390px; object-fit:cover; object-position:center 48%; border-radius:22px; margin:26px auto 24px; box-shadow:0 14px 34px #543b3026; }
    .answer .copy { margin-bottom:0; }
    .back { margin-top:24px; padding:8px 12px; min-width:auto; color:var(--muted); background:transparent; font-size:14px; }
    .back:hover { color:var(--ink); background:#f7efeb; }
    .no-message { display:none; margin-top:20px; padding:12px 16px; border-radius:14px; color:#735b4e; background:#fff1e7; font-size:14px; }
    .no-message.active { display:block; }
    @keyframes arrive { from { opacity:0; transform:translateY(10px) scale(.99); } to { opacity:1; transform:translateY(0) scale(1); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <section class="question" id="question">
      <div class="mark" aria-hidden="true">♡</div>
      <p class="eyebrow">One quick question</p>
      <h1>Hey, are you Pent ?</h1>
      <p class="copy">We’d love to know.</p>
      <div class="actions">
        <button class="primary" id="yesButton">Yes, I am</button>
        <button class="secondary" id="noButton">No</button>
      </div>
      <div class="no-message" id="noMessage" role="status">That’s okay — you’re welcome here either way! 😊</div>
    </section>
    <section class="answer" id="answer">
      <div class="mark" aria-hidden="true">✦</div>
      <p class="eyebrow">A little hello</p>
      <h1>Hey, Pent! 👋</h1>
      <p class="copy">So glad you’re here.</p>
      <img src="pent.jpeg" alt="A smiling Pent">
      <button class="back" id="backButton">← Back</button>
    </section>
  </main>
  <script>
    const question = document.getElementById('question');
    const answer = document.getElementById('answer');
    const noMessage = document.getElementById('noMessage');
    document.getElementById('yesButton').addEventListener('click', () => {
      question.hidden = true;
      answer.classList.add('active');
      document.title = 'Hey, Pent!';
      document.getElementById('backButton').focus();
    });
    document.getElementById('noButton').addEventListener('click', () => {
      noMessage.classList.add('active');
    });
    document.getElementById('backButton').addEventListener('click', () => {
      answer.classList.remove('active');
      question.hidden = false;
      noMessage.classList.remove('active');
      document.title = 'A little question for you';
      document.getElementById('yesButton').focus();
    });
  </script>
</body>
</html>
